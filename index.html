<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóm Số - Cổng Thông Tin Dân Cư</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 pb-20 md:pb-6">

    <!-- TOP HEADER -->
    <header class="bg-emerald-600 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white text-emerald-600 font-extrabold w-10 h-10 rounded-xl flex items-center justify-center shadow-inner">
                    XS
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">XÓM SỐ ĐÔ LƯƠNG</h1>
                    <p class="text-[11px] text-emerald-100">Cổng dịch vụ dân cư điện tử</p>
                </div>
            </div>
            <button onclick="triggerSOSAlert()" class="bg-red-500 hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-lg animate-pulse">
                <i class="fas fa-bell"></i> SOS Khẩn Cấp
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-3xl mx-auto px-4 py-5 space-y-5">

        <!-- THÔNG BÁO KHẨN CẤP / LOA PHƯỜNG BANNER -->
        <div id="urgent-alert-banner" class="hidden bg-red-600 text-white p-4 rounded-2xl shadow-lg space-y-2">
            <div class="flex items-center justify-between">
                <span class="bg-white text-red-600 font-extrabold text-[10px] px-2 py-0.5 rounded-full uppercase"><i class="fas fa-tower-broadcast mr-1"></i> Thông Báo Khẩn Cấp</span>
                <span id="urgent-alert-time" class="text-[11px] opacity-80"></span>
            </div>
            <h3 id="urgent-alert-title" class="font-bold text-base"></h3>
            <p id="urgent-alert-content" class="text-xs opacity-95 leading-relaxed"></p>
        </div>

        <!-- STATS QUICK VIEW -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
                <div class="bg-emerald-100 text-emerald-600 w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-wallet"></i>
                </div>
                <div>
                    <p class="text-[11px] text-slate-400 font-medium">Quỹ Xóm Hiện Tại</p>
                    <p id="stat-resident-fund" class="font-bold text-slate-800 text-sm">0 đ</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
                <div class="bg-blue-100 text-blue-600 w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <div>
                    <p class="text-[11px] text-slate-400 font-medium">Thông Báo Mới</p>
                    <p id="stat-resident-ann-count" class="font-bold text-slate-800 text-sm">0 tin</p>
                </div>
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="flex bg-slate-200 p-1 rounded-xl text-xs font-semibold text-slate-600">
            <button onclick="switchResidentTab('announcements')" id="tab-announcements" class="flex-1 py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition">Loa Phường</button>
            <button onclick="switchResidentTab('feedback')" id="tab-feedback" class="flex-1 py-2 rounded-lg transition">Gửi Phản Ánh</button>
            <button onclick="switchResidentTab('tamtru')" id="tab-tamtru" class="flex-1 py-2 rounded-lg transition">Khai Báo Tạm Trú</button>
            <button onclick="switchResidentTab('finances')" id="tab-finances" class="flex-1 py-2 rounded-lg transition">Quỹ Xóm</button>
        </div>

        <!-- TAB 1: LOA PHƯỜNG / THÔNG BÁO -->
        <div id="res-sec-announcements" class="space-y-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fas fa-bullhorn text-emerald-600"></i> Bản Tin Loa Phường</h3>
            <div id="resident-announcements-list" class="space-y-3"></div>
        </div>

        <!-- TAB 2: GỬI PHẢN ÁNH KHAI BÁO -->
        <div id="res-sec-feedback" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fas fa-paper-plane text-emerald-600"></i> Gửi Ý Kiến / Cảnh Báo Cho Ban Quản Lý</h3>
                <form onsubmit="handleSendFeedback(event)" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="fb-name" required placeholder="Họ và tên của bạn *" class="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <input type="text" id="fb-house" required placeholder="Số nhà / Ngõ *" class="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <textarea id="fb-content" required rows="3" placeholder="Nhập chi tiết nội dung phản ánh (hỏng đèn đường, sự cố an ninh...)" class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">
                        Gửi Phản Ánh
                    </button>
                </form>
            </div>

            <div class="space-y-2">
                <h4 class="font-bold text-xs text-slate-500 uppercase">Lịch sử phản ánh dân cư</h4>
                <div id="resident-feedbacks-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- TAB 3: KHAI BÁO TẠM TRÚ -->
        <div id="res-sec-tamtru" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fas fa-id-card text-purple-600"></i> Đăng Ký Khai Báo Tạm Trú Online</h3>
                <form onsubmit="handleSendTamtru(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Họ tên người tạm trú *</label>
                        <input type="text" id="tt-name" required placeholder="Nguyễn Văn A" class="w-full border rounded-xl px-3 py-2 text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">Số CCCD / Định danh *</label>
                            <input type="text" id="tt-cccd" required placeholder="0400..." class="w-full border rounded-xl px-3 py-2 text-xs">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">Số điện thoại *</label>
                            <input type="text" id="tt-phone" required placeholder="09..." class="w-full border rounded-xl px-3 py-2 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Địa chỉ tạm trú tại Xóm 3 *</label>
                        <input type="text" id="tt-address" required placeholder="Nhà số 15, Ngõ 2, Xóm 3" class="w-full border rounded-xl px-3 py-2 text-xs">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">
                        Nộp Khai Báo Tạm Trú
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 4: QUỸ XÓM CÔNG KHAI -->
        <div id="res-sec-finances" class="hidden bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fas fa-file-invoice-dollar text-emerald-600"></i> Minh Bạch Thu Chi Quỹ Xóm</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-500 font-semibold uppercase border-b border-slate-100">
                        <tr>
                            <th class="p-2">Ngày</th>
                            <th class="p-2">Nội dung</th>
                            <th class="p-2">Loại</th>
                            <th class="p-2 text-right">Số tiền</th>
                        </tr>
                    </thead>
                    <tbody id="resident-finances-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- FIREBASE & JS SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAC7mztrDAHldUlUz7eSp0eBNeLLoA_ISQ",
            authDomain: "xom-so.firebaseapp.com",
            databaseURL: "https://xom-so-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "xom-so",
            storageBucket: "xom-so.firebasestorage.app",
            messagingSenderId: "589384780300",
            appId: "1:589384780300:web:3927d2d260d9d1bf683c29",
            measurementId: "G-DEPZMTE3HX"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('xomso_data');

        let dbData = { announcements: {}, feedbacks: {}, finances: {}, residents: {} };

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                dbData = data;
                if (!dbData.announcements) dbData.announcements = {};
                if (!dbData.feedbacks) dbData.feedbacks = {};
                if (!dbData.finances) dbData.finances = {};
            }
            renderResidentData();
        });

        function renderResidentData() {
            const annList = Object.entries(dbData.announcements || {}).map(([key, val]) => ({ _key: key, ...val })).reverse();
            const fbList = Object.entries(dbData.feedbacks || {}).map(([key, val]) => ({ _key: key, ...val })).reverse();
            const finList = Object.entries(dbData.finances || {}).map(([key, val]) => ({ _key: key, ...val })).reverse();

            // 1. Quỹ xóm
            const totalFund = Object.values(dbData.finances || {}).reduce((sum, item) => item.type === 'Thu' ? sum + Number(item.amount) : sum - Number(item.amount), 0);
            document.getElementById('stat-resident-fund').innerText = totalFund.toLocaleString('vi-VN') + ' đ';

            // 2. Đếm thông báo
            document.getElementById('stat-resident-ann-count').innerText = annList.length + ' tin';

            // 3. Banner khẩn cấp
            const urgentAnn = annList.find(a => a.urgent);
            const banner = document.getElementById('urgent-alert-banner');
            if (urgentAnn) {
                banner.classList.remove('hidden');
                document.getElementById('urgent-alert-title').innerText = urgentAnn.title;
                document.getElementById('urgent-alert-content').innerText = urgentAnn.content;
                document.getElementById('urgent-alert-time').innerText = urgentAnn.date;
            } else {
                banner.classList.add('hidden');
            }

            // 4. List Thông Báo Loa Phường
            document.getElementById('resident-announcements-list').innerHTML = annList.map(a => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-xs ${a.urgent ? 'text-red-600' : 'text-slate-800'}">${a.title}</h4>
                        <span class="text-[10px] text-slate-400">${a.date}</span>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed">${a.content}</p>
                </div>
            `).join('');

            // 5. List Phản Ánh
            document.getElementById('resident-feedbacks-list').innerHTML = fbList.map(f => `
                <div class="bg-white p-3 rounded-xl border border-slate-100 space-y-1 text-xs">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700">${f.name} <span class="text-[10px] text-slate-400 font-normal">(${f.houseNo})</span></span>
                        <span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${f.status === 'Chờ xử lý' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${f.status}</span>
                    </div>
                    <p class="text-slate-600">${f.content}</p>
                </div>
            `).join('');

            // 6. List Thu Chi
            document.getElementById('resident-finances-tbody').innerHTML = finList.map(f => `
                <tr>
                    <td class="p-2 text-slate-400 text-[11px]">${f.date || '---'}</td>
                    <td class="p-2 font-medium text-slate-800">${f.title}</td>
                    <td class="p-2 font-bold ${f.type === 'Thu' ? 'text-emerald-600' : 'text-red-500'}">${f.type}</td>
                    <td class="p-2 text-right font-bold">${Number(f.amount).toLocaleString('vi-VN')} đ</td>
                </tr>
            `).join('');
        }

        function handleSendFeedback(e) {
            e.preventDefault();
            const newFb = {
                name: document.getElementById('fb-name').value,
                houseNo: document.getElementById('fb-house').value,
                content: document.getElementById('fb-content').value,
                status: 'Chờ xử lý',
                time: new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) + ' ' + new Date().toLocaleDateString('vi-VN')
            };
            dbRef.child('feedbacks').push(newFb);
            e.target.reset();
            alert("Đã gửi phản ánh đến BQL Xóm thành công!");
        }

        function handleSendTamtru(e) {
            e.preventDefault();
            const newTamtru = {
                name: document.getElementById('tt-name').value,
                cccd: document.getElementById('tt-cccd').value,
                phone: document.getElementById('tt-phone').value,
                address: document.getElementById('tt-address').value,
                code: 'TT-' + Math.floor(1000 + Math.random() * 9000),
                members: 1,
                isTamtru: true,
                tamtruApproved: false
            };
            dbRef.child('residents').push(newTamtru);
            e.target.reset();
            alert("Đã nộp hồ sơ khai báo tạm trú! Ban quản lý sẽ phê duyệt sớm.");
        }

        function triggerSOSAlert() {
            const name = prompt("Nhập tên hộ gia đình của bạn:");
            if (name) {
                dbRef.child('feedbacks').push({
                    name: name,
                    houseNo: 'Tín hiệu SOS Khẩn Cấp',
                    content: '🚨 CẦN TRỢ GIÚP KHẨN CẤP TẠI NHÀ!',
                    status: 'Chờ xử lý',
                    time: new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})
                });
                alert("Đã phát tín hiệu SOS khẩn cấp tới BQL Xóm!");
            }
        }

        function switchResidentTab(tabName) {
            ['announcements', 'feedback', 'tamtru', 'finances'].forEach(t => {
                document.getElementById(`res-sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('bg-white', 'text-emerald-600', 'shadow-sm');
            });
            document.getElementById(`res-sec-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('bg-white', 'text-emerald-600', 'shadow-sm');
        }
    </script>
</body>
</html>
